[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-eval"
version = "0.1.0"
description = "Hermetic Long-Horizon Reasoning & Multi-Turn Agent Evaluation Benchmark Harness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DeepMind & NeMo Agent Evaluation Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "datasets>=2.14.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "tabulate>=0.9.0",
    "sympy>=1.12"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "polars>=0.20.0"
]

[project.scripts]
nemo-eval = "nemo_eval.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
