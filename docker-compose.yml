version: '3.8'

services:
  eval:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./results:/app/results
      - ./gsm8k_results:/app/gsm8k_results
      - ./configs:/app/configs
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - GROQ_API_KEY=${GROQ_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["run", "--config", "gsm8k_config.json"]
